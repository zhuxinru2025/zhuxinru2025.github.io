<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小学英语辅助</title>
<style>
  :root {
    --blue: #2f7fe0;
    --blue-dark: #1c4f9c;
    --blue-bg: #eef4fb;
    --ink: #22314e;
    --sub: #7a8aa5;
    --line: #dce6f2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--blue-bg);
    color: var(--ink);
    display: flex; flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  /* ===== 顶部导航 ===== */
  header {
    flex: none;
    display: flex; align-items: center; gap: 8px;
    height: 56px; padding: 0 10px;
    background: #fff;
    box-shadow: 0 1px 6px rgba(28, 79, 156, .10);
    z-index: 10;
  }
  .logo {
    flex: none; width: 40px; height: 40px; border-radius: 12px;
    background: var(--blue);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 20px; user-select: none;
    box-shadow: 0 2px 5px rgba(47, 127, 224, .35);
  }
  .app-name { flex: none; font-size: 15px; font-weight: 700; color: var(--blue-dark); white-space: nowrap; }
  nav {
    flex: 1; display: flex; gap: 2px; min-width: 0;
    overflow-x: auto; scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    flex: none; border: 0; background: transparent;
    font-size: 14px; color: var(--sub);
    padding: 8px 10px; border-radius: 10px; cursor: pointer;
    white-space: nowrap; transition: background .15s, color .15s;
  }
  nav button.on { background: var(--blue-bg); color: var(--blue-dark); font-weight: 700; }

  /* ===== 主区域 ===== */
  main { flex: 1; min-height: 0; position: relative; }
  .view { position: absolute; inset: 0; display: none; }
  .view.on { display: flex; }

  /* ===== 首页 ===== */
  #view-home {
    flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px;
  }
  .hero-logo {
    width: 108px; height: 108px; border-radius: 30px;
    background: var(--blue);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 54px; font-weight: 800;
    box-shadow: 0 10px 26px rgba(47, 127, 224, .35);
  }
  .hero-title { font-size: 24px; font-weight: 800; color: var(--blue-dark); }
  .hero-sub { font-size: 13px; color: var(--sub); text-align: center; line-height: 1.7; }
  .hero-tip {
    margin-top: 8px; font-size: 12px; color: var(--sub);
    background: #fff; border: 1px solid var(--line);
    padding: 8px 16px; border-radius: 20px;
  }

  /* ===== 年级页（单元列表） ===== */
  #view-grade { flex-direction: column; }
  .grade-head {
    flex: none; display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; background: #fff;
    border-bottom: 1px solid var(--line);
  }
  .grade-title { flex: 1; min-width: 0; font-size: 15px; font-weight: 700; color: var(--blue-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grade-body { flex: 1; overflow-y: auto; padding: 6px 14px 20px; }
  .book-name {
    font-size: 14px; font-weight: 700; color: var(--blue-dark);
    margin: 16px 2px 9px; display: flex; align-items: center; gap: 7px;
  }
  .book-name::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--blue); }
  .book-soon {
    font-size: 13px; color: var(--sub);
    background: #fff; border: 1px dashed var(--line);
    border-radius: 12px; padding: 16px; text-align: center;
  }
  .unit-grid {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  }
  .unit-card {
    background: #fff; border-radius: 14px; padding: 15px 16px;
    cursor: pointer; border: 2px solid transparent;
    box-shadow: 0 2px 8px rgba(28, 79, 156, .07);
    transition: transform .12s, border-color .12s, box-shadow .12s;
  }
  .unit-card:active { transform: scale(.97); }
  .unit-card:hover { border-color: var(--blue); box-shadow: 0 3px 12px rgba(47, 127, 224, .15); }
  .uc-title { font-size: 15px; font-weight: 700; color: var(--blue-dark); line-height: 1.45; }
  .uc-meta { font-size: 12px; color: var(--sub); margin-top: 7px; }

  /* ===== 课程页 ===== */
  #view-unit { flex-direction: column; }
  .unit-head {
    flex: none; display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; background: #fff;
    border-bottom: 1px solid var(--line);
  }
  .back-btn {
    flex: none; display: flex; align-items: center; gap: 3px;
    border: 0; background: var(--blue-bg); color: var(--blue-dark);
    font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 9px; cursor: pointer;
  }
  .unit-title { flex: 1; min-width: 0; font-size: 15px; font-weight: 700; color: var(--blue-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .workspace { flex: 1; min-height: 0; display: flex; }

  /* 横屏：左 70% 视频 / 右 30% 单词 */
  @media (orientation: landscape) {
    .workspace { flex-direction: row; }
    .video-panel { flex: 0 0 70%; }
    .word-panel { flex: 0 0 30%; }
  }
  /* 竖屏：上 50% 视频 / 下 50% 单词 */
  @media (orientation: portrait) {
    .workspace { flex-direction: column; }
    .video-panel { flex: 0 0 50%; }
    .word-panel { flex: 0 0 50%; }
  }

  .video-panel { display: flex; flex-direction: column; background: #10141c; min-height: 0; }
  .video-tabs {
    flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px;
    background: #151a24;
  }
  .video-tabs button {
    border: 0; background: #232a38; color: #9fb0c8;
    font-size: 13px; font-weight: 600;
    padding: 7px 14px; border-radius: 9px; cursor: pointer;
  }
  .video-tabs button.on { background: var(--blue); color: #fff; }
  .video-wrap { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
  #player { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  .video-empty {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    color: #7d8aa3; font-size: 14px; text-align: center; padding: 20px; line-height: 1.8;
  }

  .word-panel { display: flex; flex-direction: column; background: var(--blue-bg); min-height: 0; }
  .panel-title {
    flex: none; display: flex; align-items: baseline; gap: 8px;
    padding: 9px 12px 6px; font-size: 14px; font-weight: 700; color: var(--blue-dark);
  }
  .panel-title span { font-size: 11px; font-weight: 400; color: var(--sub); }
  .word-list {
    flex: 1; overflow-y: auto; padding: 8px 10px 14px;
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    align-content: start;
  }
  @media (min-width: 900px) and (orientation: landscape) { .word-list { grid-template-columns: repeat(3, 1fr); } }

  .wcard {
    background: #fff; border-radius: 12px; padding: 10px 8px 8px;
    text-align: center; cursor: pointer; user-select: none;
    border: 2px solid transparent;
    box-shadow: 0 2px 6px rgba(28, 79, 156, .07);
    transition: transform .12s, border-color .12s, box-shadow .12s;
  }
  .wcard:active { transform: scale(.95); }
  .wcard.speaking {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(47, 127, 224, .18);
    background: #f2f8ff;
  }
  .wcard .w { font-size: 19px; font-weight: 700; color: var(--blue-dark); word-break: break-all; line-height: 1.3; }
  .wcard .ipa { font-size: 12px; color: var(--sub); margin: 3px 0 5px; word-break: break-all; }
  .wcard .pos {
    display: inline-block; font-size: 10px; color: #fff;
    background: #7fa8d9; border-radius: 8px; padding: 1px 7px; margin-bottom: 4px;
  }
  .wcard .mean { font-size: 13px; color: var(--ink); line-height: 1.4; }
  .wcard .ext { font-size: 11px; color: var(--sub); margin-top: 2px; }

  /* ===== Toast ===== */
  #toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
    background: rgba(20, 28, 44, .92); color: #fff;
    font-size: 13px; padding: 9px 18px; border-radius: 20px;
    z-index: 99; opacity: 0; pointer-events: none;
    transition: opacity .2s; max-width: 82%; text-align: center;
  }
  #toast.show { opacity: 1; }

  /* ===== 课后练习 Quiz ===== */
  .quiz-panel {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center;
    background: var(--blue-bg); overflow-y: auto;
    padding: 16px 20px 20px;
  }
  .quiz-panel.on { display: flex; }

  .quiz-progress-bar {
    flex: none; width: 100%; max-width: 500px; height: 4px;
    background: var(--line); border-radius: 2px; margin-bottom: 16px;
  }
  .quiz-progress-fill {
    height: 100%; background: var(--blue); width: 0%;
    border-radius: 2px; transition: width .3s;
  }
  .quiz-progress-text {
    flex: none; font-size: 13px; color: var(--sub); margin-bottom: 12px;
  }

  .qtype-badge {
    display: inline-block; font-size: 12px; font-weight: 600;
    padding: 3px 10px; border-radius: 10px; margin-bottom: 10px;
  }
  .qtype-word { background: #e3f2fd; color: #1565c0; }
  .qtype-phrase { background: #fff3e0; color: #e65100; }
  .qtype-sentence { background: #f3e5f5; color: #7b1fa2; }

  .q-label { font-size: 13px; color: var(--sub); margin-bottom: 6px; }
  .q-chinese {
    font-size: 36px; font-weight: 800; color: var(--blue-dark);
    margin-bottom: 4px; text-align: center; line-height: 1.3;
  }
  .q-hint { font-size: 13px; color: var(--sub); margin-bottom: 20px; }
  .q-hint .q-count { color: var(--blue); font-weight: 600; }

  .q-input-wrap { width: 100%; max-width: 400px; margin-bottom: 12px; }
  .q-input {
    width: 100%;
    font-size: 24px; font-weight: 700; text-align: center;
    padding: 14px 18px; border-radius: 14px;
    border: 2px solid var(--line); background: #fff;
    color: var(--ink); outline: none;
    transition: border-color .2s, background .2s;
  }
  .q-input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(47, 127, 224, .15);
  }
  .q-input.correct { border-color: #34a853; background: #e8f5e9; color: #34a853; }
  .q-input.wrong { border-color: #ea4335; background: #fff5f5; }

  .q-result {
    font-size: 16px; font-weight: 700; min-height: 26px; margin-bottom: 12px; text-align: center;
  }
  .q-result.correct { color: #34a853; }
  .q-result.wrong { color: #ea4335; }
  .q-result.reveal { color: #856404; }

  .q-btn-bar {
    flex: none; display: flex; gap: 8px;
    width: 100%; max-width: 400px; margin-top: auto; padding-top: 10px;
  }
  .q-btn {
    flex: 1; border: 0; border-radius: 12px;
    font-size: 15px; font-weight: 700;
    padding: 12px 0; cursor: pointer;
    transition: transform .12s;
  }
  .q-btn:active { transform: scale(.96); }
  .q-btn:disabled { opacity: .5; }
  .q-btn-speak { background: var(--blue-bg); color: var(--blue-dark); }
  .q-btn-answer { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
  .q-btn-submit {
    flex: 1.4; background: var(--blue); color: #fff;
    box-shadow: 0 3px 10px rgba(47, 127, 224, .35);
  }
  .q-btn-quit { background: var(--blue-bg); color: var(--blue-dark); }

  /* 完成页 */
  .q-score { text-align: center; padding: 20px 16px; width: 100%; }
  .q-score-emoji { font-size: 56px; margin-bottom: 12px; }
  .q-score-title { font-size: 20px; font-weight: 800; color: var(--blue-dark); margin-bottom: 6px; }
  .q-score-detail { font-size: 14px; color: var(--sub); margin-bottom: 16px; }
  .q-egg-btn {
    display: inline-block;
    background: linear-gradient(135deg, #ff6b6b, #feca57);
    color: #fff; font-size: 16px; font-weight: 800;
    padding: 14px 32px; border-radius: 50px;
    border: 0; cursor: pointer; margin-top: 8px;
    box-shadow: 0 5px 16px rgba(255, 107, 107, .4);
    animation: qpulse 1.5s infinite;
  }
  .q-egg-btn:active { transform: scale(.96); }
  @keyframes qpulse {
    0%,100% { box-shadow: 0 5px 16px rgba(255,107,107,.4); }
    50% { box-shadow: 0 5px 28px rgba(255,107,107,.7); }
  }
  .q-retry-row {
    display: flex; gap: 10px; justify-content: center; margin-top: 16px;
  }
  .q-retry-btn {
    flex: 1; max-width: 140px; padding: 12px 0; border-radius: 12px;
    border: 0; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .q-retry { background: var(--blue-bg); color: var(--blue-dark); }
  .q-back { background: var(--blue-bg); color: var(--blue-dark); }

  /* 动画彩蛋层 */
  .egg-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.95);
    z-index: 100; display: none;
    flex-direction: column; align-items: center; justify-content: center;
  }
  .egg-overlay.show { display: flex; }
  .egg-overlay video { max-width: 95%; max-height: 85%; border-radius: 12px; }
  .egg-close {
    margin-top: 14px;
    background: rgba(255,255,255,.2); color: #fff;
    border: 0; font-size: 14px; font-weight: 600;
    padding: 8px 24px; border-radius: 18px; cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <div class="logo" aria-label="App 标志">英</div>
  <div class="app-name">小学英语辅助</div>
  <nav id="gradeNav"></nav>
</header>

<main>
  <!-- 首页 -->
  <section class="view on" id="view-home">
    <div class="hero-logo">英</div>
    <div class="hero-title">小学英语辅助</div>
    <div class="hero-sub">外研版（新启航）一年级起点<br>点上方年级进入课程，横屏或竖屏均可使用</div>
    <div class="hero-tip">点击单词即可听发音</div>
  </section>

  <!-- 年级页（单元列表） -->
  <section class="view" id="view-grade">
    <div class="grade-head">
      <button class="back-btn" id="gradeBackBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        返回
      </button>
      <div class="grade-title" id="gradeTitle"></div>
    </div>
    <div class="grade-body" id="gradeBody"></div>
  </section>

  <!-- 课程页 -->
  <section class="view" id="view-unit">
    <div class="unit-head">
      <button class="back-btn" id="backBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        返回
      </button>
      <div class="unit-title" id="unitTitle"></div>
    </div>
    <div class="workspace">
      <div class="video-panel">
        <div class="video-tabs" id="videoTabs"></div>
        <div class="video-wrap">
          <video id="player" controls playsinline preload="metadata"></video>
          <div class="video-empty" id="videoEmpty">本单元为阅读拓展词，暂无视频</div>
        </div>
        <!-- 课后练习面板 -->
        <div class="quiz-panel" id="quizPanel">
          <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="qProgressFill"></div></div>
          <div class="quiz-progress-text" id="qProgressText">1 / 6</div>
          <div class="qtype-badge" id="qBadge">单词</div>
          <div class="q-label">中文意思</div>
          <div class="q-chinese" id="qChinese">你好</div>
          <div class="q-hint">英文：<span class="q-count" id="qCount">5个字符</span></div>
          <div class="q-input-wrap">
            <input type="text" class="q-input" id="qInput"
                   placeholder="输入英文" autocomplete="off" autocapitalize="off" spellcheck="false">
          </div>
          <div class="q-result" id="qResult"></div>
          <div class="q-btn-bar">
            <button class="q-btn q-btn-speak" id="qBtnSpeak">🔊 朗读</button>
            <button class="q-btn q-btn-answer" id="qBtnAnswer">💡 答案</button>
            <button class="q-btn q-btn-submit" id="qBtnSubmit">✓ 提交</button>
          </div>
        </div>
      </div>
      <div class="word-panel">
        <div class="panel-title" id="wordPanelTitle">本课单词 <span>点击朗读</span></div>
        <div class="word-list" id="wordList"></div>
      </div>
    </div>
  </section>
</main>

<div id="toast"></div>

<!-- 动画彩蛋层 -->
<div class="egg-overlay" id="eggOverlay">
  <video id="eggVideo" controls playsinline></video>
  <button class="egg-close" id="eggClose">关闭</button>
</div>

function buildNav() {
  nav.innerHTML = "";
  GRADE_NAMES.forEach(function (name, i) {
    var btn = document.createElement("button");
    btn.textContent = name;
    btn.dataset.grade = String(i + 1);
    btn.addEventListener("click", function () {
      var g = parseInt(btn.dataset.grade, 10);
      if (AVAILABLE_GRADES.indexOf(g) === -1) {
        toast(name + "内容即将上线");
        return;

      location.hash = "#/grade/" + g;
    });
    nav.appendChild(btn);
  });

  var btns = nav.querySelectorAll("button");

    btns[i].classList.toggle("on", parseInt(btns[i].dataset.grade, 10) === grade);
  }
}

function esc(s) {
  var d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);

function renderWords(unit) {
  wordList.innerHTML = "";
  unit.words.forEach(function (w) {
    var card = document.createElement("div");
    card.className = "wcard";
    card.dataset.audio = RESOURCE_BASE + "media/audio/" + w.audio;
    var html =
      '<div class="w">' + esc(w.text) + '</div>' +
      (w.ipa ? '<div class="ipa">/' + esc(w.ipa) + '/</div>' : '') +
      (w.pos ? '<span class="pos">' + esc(w.pos) + '</span>' : '') +
      '<div class="mean">' + esc(w.mean) + '</div>' +
      (w.ext ? '<div class="ext">= ' + esc(w.ext) + '</div>' : '');
    card.innerHTML = html;
    card.addEventListener("click", function () { playWord(card); });
    wordList.appendChild(card);
  });
}

// 首次用户交互时解锁音频播放权限（微信/Chrome 自动播放策略）
function unlockAudioOnce() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  wordAudio.src = SILENT_WAV;
  wordAudio.volume = 0;
  var p = wordAudio.play();
  if (p && p.then) {
    p.then(function () {
      setTimeout(function () {
        try { wordAudio.pause(); } catch (e) {}
        wordAudio.volume = 1;
      }, 60);
    }).catch(function () {
      wordAudio.volume = 1;
    });
  }
  document.removeEventListener("click", unlockAudioOnce);
  document.removeEventListener("touchstart", unlockAudioOnce);
}
document.addEventListener("click", unlockAudioOnce);
document.addEventListener("touchstart", unlockAudioOnce);

function playWord(card) {
  var src = card.dataset.audio;
  if (currentAudio) {
    try { currentAudio.pause(); } catch (e) {}
    currentAudio = null;
  }
  if (speakingCard) { speakingCard.classList.remove("speaking"); speakingCard = null; }

  if (!audioUnlocked) unlockAudioOnce();

  currentAudio = wordAudio;
  speakingCard = card;
  card.classList.add("speaking");
  wordAudio.onended = function () {
    card.classList.remove("speaking");
    if (speakingCard === card) speakingCard = null;
    if (currentAudio === wordAudio) currentAudio = null;
  };
  wordAudio.onerror = function () {
    card.classList.remove("speaking");
    if (speakingCard === card) speakingCard = null;
    if (currentAudio === wordAudio) currentAudio = null;
    toast("音频加载失败：" + src);
  };
  wordAudio.src = src;
  wordAudio.load();
  var p = wordAudio.play();
  if (p && p.catch) {
    p.catch(function () {
      card.classList.remove("speaking");
      toast("点击浏览器后请允许播放声音");
    });
  }
}

/* ===== 视频 ===== */
var quizPanel = document.getElementById("quizPanel");
var qChinese = document.getElementById("qChinese");
var qCount = document.getElementById("qCount");
var qBadge = document.getElementById("qBadge");
var qInput = document.getElementById("qInput");
var qResult = document.getElementById("qResult");
var qProgressText = document.getElementById("qProgressText");
var qProgressFill = document.getElementById("qProgressFill");
var qBtnSubmit = document.getElementById("qBtnSubmit");
var qBtnAnswer = document.getElementById("qBtnAnswer");
var qBtnQuit = null;
var qBtnSpeak = document.getElementById("qBtnSpeak");

var qCurrent = 0;
var qCorrect = 0;
var qAnswered = false;
var qRevealed = false;
var qQuestions = [];

function renderTabs(unit) {
  videoTabs.innerHTML = "";
  var keys = unit.videos ? Object.keys(unit.videos) : [];
  keys.forEach(function (key) {
    var v = unit.videos[key];
    var btn = document.createElement("button");
    btn.textContent = v.label || key;
    btn.dataset.key = key;
    btn.addEventListener("click", function () { setVideo(unit, key); });
    videoTabs.appendChild(btn);
  });
  // 课后练习tab
  if (QUIZ_DATA[unit.id] && QUIZ_DATA[unit.id].length > 0) {
    var qbtn = document.createElement("button");
    qbtn.textContent = "课后练习";
    qbtn.dataset.key = "quiz";
    qbtn.addEventListener("click", function () { setVideo(unit, "quiz"); });
    videoTabs.appendChild(qbtn);
  }
  videoTabs.style.display = "";
}

function setVideo(unit, key) {
  currentVideoKey = key;
  var btns = videoTabs.querySelectorAll("button");
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle("on", btns[i].dataset.key === key);
  }

  if (key === "quiz") {
    player.pause();
    player.style.display = "none";
    videoEmpty.style.display = "none";
    quizPanel.classList.add("on");
    startQuiz(unit.id);
    return;
  }

  quizPanel.classList.remove("on");
  player.style.display = "block";

  var v = unit.videos ? unit.videos[key] : null;
  if (v && v.file) {
    player.src = RESOURCE_BASE + "media/video/" + v.file;
    videoEmpty.style.display = "none";
    player.load();
  } else {
    player.pause();
    player.removeAttribute("src");
    player.style.display = "none";
    videoEmpty.style.display = "flex";
  }
}

/* ===== 课后练习逻辑 ===== */
var QUIZ_HTML =
  '<div class="quiz-progress-bar"><div class="quiz-progress-fill" id="qProgressFill"></div></div>' +
  '<div class="quiz-progress-text" id="qProgressText"></div>' +
  '<div class="qtype-badge" id="qBadge"></div>' +
  '<div class="q-label">中文意思</div>' +
  '<div class="q-chinese" id="qChinese"></div>' +
  '<div class="q-hint">英文：<span class="q-count" id="qCount"></span></div>' +
  '<div class="q-input-wrap"><input type="text" class="q-input" id="qInput" placeholder="输入英文" autocomplete="off" autocapitalize="off" spellcheck="false"></div>' +
  '<div class="q-result" id="qResult"></div>' +
  '<div class="q-btn-bar">' +
  '<button class="q-btn q-btn-speak" id="qBtnSpeak">🔊 朗读</button>' +
  '<button class="q-btn q-btn-answer" id="qBtnAnswer">💡 答案</button>' +
  '<button class="q-btn q-btn-submit" id="qBtnSubmit">✓ 提交</button>' +
  '<button class="q-btn q-btn-quit" id="qBtnQuit">✕ 退出</button>' +
  '</div>';

function refreshQuizRefs() {
  qChinese = document.getElementById("qChinese");
  qCount = document.getElementById("qCount");
  qBadge = document.getElementById("qBadge");
  qInput = document.getElementById("qInput");
  qResult = document.getElementById("qResult");
  qProgressText = document.getElementById("qProgressText");
  qProgressFill = document.getElementById("qProgressFill");
  qBtnSubmit = document.getElementById("qBtnSubmit");
  qBtnAnswer = document.getElementById("qBtnAnswer");
  qBtnSpeak = document.getElementById("qBtnSpeak");
  qBtnQuit = document.getElementById("qBtnQuit");
}

function startQuiz(unitId) {
  quizPanel.innerHTML = QUIZ_HTML;
  refreshQuizRefs();
  qBindEvents();
  qQuestions = QUIZ_DATA[unitId] || [];
  qCurrent = 0;
  qCorrect = 0;
  loadQ();
}

function loadQ() {
  var q = qQuestions[qCurrent];
  qChinese.textContent = q.zh;
  qCount.textContent = q.en.length + "个字符";
  qInput.value = "";
  qInput.className = "q-input";
  qResult.textContent = "";
  qResult.className = "q-result";
  qProgressText.textContent = (qCurrent + 1) + " / " + qQuestions.length;
  qProgressFill.style.width = (qCurrent / qQuestions.length * 100) + "%";
  qAnswered = false;
  qRevealed = false;
  qBtnSubmit.textContent = "✓ 提交";
  qBtnAnswer.textContent = "💡 答案";
  qBtnAnswer.disabled = false;

  if (q.type === "word") {
    qBadge.textContent = "单词";
    qBadge.className = "qtype-badge qtype-word";
  } else if (q.type === "phrase") {
    qBadge.textContent = "短语";
    qBadge.className = "qtype-badge qtype-phrase";
  } else {
    qBadge.textContent = "句子";
    qBadge.className = "qtype-badge qtype-sentence";
  }
  qInput.focus();
}

function qNormalize(s) {
  return s.trim().toLowerCase().replace(/[.,!?!"']/g, "").replace(/\s+/g, " ");
}

function qSpeak(audioFile, fallbackText) {
  if (audioFile) {
    var src = RESOURCE_BASE + "media/audio/" + audioFile;
    if (currentAudio) { try { currentAudio.pause(); } catch(e){} }
    currentAudio = new Audio(src);
    currentAudio.play().catch(function() { qTTS(fallbackText); });
  } else {
    qTTS(fallbackText);
  }
}

function qTTS(text) {
  try {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.8;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch(e) {}
}

function qCheck() {
  if (qAnswered) { qNext(); return; }
  var q = qQuestions[qCurrent];
  qAnswered = true;
  if (qNormalize(qInput.value) === qNormalize(q.en)) {
    qInput.className = "q-input correct";
    qResult.textContent = "✓ 正确";
    qResult.className = "q-result correct";
    qCorrect++;
    qSpeak(q.audio, q.en);
    setTimeout(function() { qNext(); }, 1000);
  } else {
    qInput.className = "q-input wrong";
    qResult.textContent = "✗ 答错了，点答案查看";
    qResult.className = "q-result wrong";
    qBtnSubmit.textContent = "下一题 →";
  }
}

function qReveal() {
  var q = qQuestions[qCurrent];
  qInput.value = q.en;
  qInput.className = "q-input wrong";
  qResult.textContent = "答案：" + q.en;
  qResult.className = "q-result reveal";
  qRevealed = true;
  qSpeak(q.audio, q.en);
  if (!qAnswered) {
    qAnswered = true;
    qBtnSubmit.textContent = "下一题 →";
  }
}

function qNext() {
  qCurrent++;
  if (qCurrent >= qQuestions.length) {
    qFinish();
  } else {
    loadQ();
  }
}

function qFinish() {
  var allCorrect = (qCorrect === qQuestions.length);
  var emoji = allCorrect ? "🎉" : "💪";
  var title = allCorrect ? "全部答对啦~你真棒！" : "练习完成";
  var detail = allCorrect ? "奖励你看一集动画片。" : "答对 " + qCorrect + " / " + qQuestions.length + " 题";

  var bottom;
  var egg = EGG_ANIMATION[currentUnitId];
  if (allCorrect && egg) {
    bottom =
      '<button class="q-egg-btn" id="qEggBtn">▶ 播放' + egg.ep + '</button>' +
      '<div style="margin-top:14px;"><button class="q-retry-btn q-back" id="qExitBtn" style="max-width:160px;">✕ 退出练习</button></div>';
  } else {
    bottom = '<div class="q-retry-row">' +
      '<button class="q-retry-btn q-retry" id="qRetryBtn">🔄 重新练习</button>' +
      '<button class="q-retry-btn q-back" id="qBackBtn">✕ 退出练习</button>' +
      '</div>';
  }

  quizPanel.innerHTML =
    '<div class="q-score">' +
    '<div class="q-score-emoji">' + emoji + '</div>' +
    '<div class="q-score-title">' + title + '</div>' +
    '<div class="q-score-detail">' + detail + '</div>' +
    bottom +
    '</div>';
  qProgressFill.style.width = "100%";

  if (allCorrect && egg) {
    document.getElementById("qEggBtn").addEventListener("click", function() {
      var overlay = document.getElementById("eggOverlay");
      var video = document.getElementById("eggVideo");
      video.src = RESOURCE_BASE + "media/animation/" + egg.file;
      overlay.classList.add("show");
      video.play();
    });
    document.getElementById("qExitBtn").addEventListener("click", qExit);
  } else {
    document.getElementById("qRetryBtn").addEventListener("click", function() {
      startQuiz(currentUnitId);
    });
    document.getElementById("qBackBtn").addEventListener("click", qExit);
  }
}

function qBindEvents() {
  qBtnSubmit.onclick = function() { qCheck(); };
  qBtnAnswer.onclick = function() { qReveal(); };
  qBtnSpeak.onclick = function() {
    var q = qQuestions[qCurrent];
    if (q) qSpeak(q.audio, q.en);
  };
  if (qBtnQuit) {
    qBtnQuit.onclick = function() { qExit(); };
  }
  qInput.onkeydown = function(e) {
    if (e.key === "Enter") {
      if (qAnswered) { qNext(); }
      else { qCheck(); }
    }
  };
}

function qExit() {
  // 退出quiz，回到该单元第一个视频tab
  quizPanel.classList.remove("on");
  player.style.display = "block";
  var unit = WORDS_DATA.find(function(u){ return u.id === currentUnitId; });
  if (unit && unit.videos) {
    var firstKey = Object.keys(unit.videos)[0];
    setVideo(unit, firstKey);
  }
}

// 初始绑定
qBindEvents();

// 动画关闭
document.getElementById("eggClose").addEventListener("click", function() {
  var overlay = document.getElementById("eggOverlay");
  var video = document.getElementById("eggVideo");
  video.pause();
  video.src = "";
  overlay.classList.remove("show");
});
function unitGrade(unitId) {
  for (var g in GRADE_BOOKS) {
    var books = GRADE_BOOKS[g];
    for (var b = 0; b < books.length; b++) {
      if (books[b].units.indexOf(unitId) !== -1) return parseInt(g, 10);
    }
  }
  return null;
}

function showUnit(id) {
  var idx = -1;
  for (var i = 0; i < WORDS_DATA.length; i++) {
    if (WORDS_DATA[i].id === id) { idx = i; break; }
  }
  if (idx === -1) { location.hash = "#/"; return; }
  var unit = WORDS_DATA[idx];
  currentUnitId = id;
  currentGrade = unitGrade(id);

  unitTitle.textContent = unit.title;
  var vm = VIDEO_MAP[id];
  unit.videos = vm || null;
  wordPanelTitle.innerHTML = "本课单词 <span>(" + unit.words.length + " 个，点击朗读)</span>";

  renderTabs(unit);
  renderWords(unit);
  // 进入新单元时默认显示第一个视频tab，不沿用quiz
  var firstKey = "chant";
  if (unit.videos) {
    var vk = Object.keys(unit.videos);
    if (vk.length > 0) firstKey = vk[0];
  }
  setVideo(unit, firstKey);
  markNav(currentGrade);

  viewHome.classList.remove("on");
  viewGrade.classList.remove("on");
  viewUnit.classList.add("on");
}

/* ===== 年级视图（单元列表） ===== */
function showGrade(gradeId) {
  var books = GRADE_BOOKS[gradeId];
  if (!books) { location.hash = "#/"; return; }
  currentGrade = gradeId;
  currentUnitId = null;
  if (player) { player.pause(); }

  gradeTitle.textContent = GRADE_NAMES[gradeId - 1] || ("年级 " + gradeId);
  gradeBody.innerHTML = "";
  books.forEach(function (book) {
    var group = document.createElement("div");
    group.className = "book-group";

    var h = document.createElement("div");
    h.className = "book-name";
    h.textContent = book.name;
    group.appendChild(h);

    if (!book.units || book.units.length === 0) {
      var soon = document.createElement("div");
      soon.className = "book-soon";
      soon.textContent = book.name + "内容即将上线";
      group.appendChild(soon);
    } else {
      var grid = document.createElement("div");
      grid.className = "unit-grid";
      book.units.forEach(function (uid) {
        var u = null;
        for (var i = 0; i < WORDS_DATA.length; i++) {
          if (WORDS_DATA[i].id === uid) { u = WORDS_DATA[i]; break; }
        }
        if (!u) return;
        var card = document.createElement("div");
        card.className = "unit-card";
        var vm2 = VIDEO_MAP[uid];
        var vcount = vm2 ? Object.keys(vm2).length : 0;
        var meta = u.words.length + " 个单词 · " + (vcount ? vcount + " 个视频" : "无视频");
        card.innerHTML = '<div class="uc-title">' + esc(u.title) + '</div>' +
          '<div class="uc-meta">' + meta + '</div>';
        card.addEventListener("click", function () { location.hash = "#/unit/" + uid; });
        grid.appendChild(card);
      });
      group.appendChild(grid);
    }
    gradeBody.appendChild(group);
  });

  markNav(gradeId);
  viewHome.classList.remove("on");
  viewUnit.classList.remove("on");
  viewGrade.classList.add("on");
}

function showHome() {
  currentGrade = null;
  currentUnitId = null;
  if (player) { player.pause(); }
  markNav(null);
  viewUnit.classList.remove("on");
  viewGrade.classList.remove("on");
  viewHome.classList.add("on");
}

/* ===== 路由 ===== */
function route() {
  var h = location.hash || "";
  var m = h.match(/^#\/unit\/(\d+)$/);
  if (m) {
    var id = parseInt(m[1], 10);
    var exists = WORDS_DATA.some(function (u) { return u.id === id; });
    if (exists) { showUnit(id); return; }
  }
  var mg = h.match(/^#\/grade\/(\d+)$/);
  if (mg) {
    var g = parseInt(mg[1], 10);
    if (GRADE_BOOKS[g]) { showGrade(g); return; }
  }
  showHome();
}

/* ===== 事件 ===== */
document.getElementById("backBtn").addEventListener("click", function () {
  if (currentGrade) { location.hash = "#/grade/" + currentGrade; return; }
  location.hash = "#/";
});
document.getElementById("gradeBackBtn").addEventListener("click", function () {
  location.hash = "#/";
});
window.addEventListener("hashchange", route);

/* ===== 启动 ===== */
buildNav();
route();
</script>
